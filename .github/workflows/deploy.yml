
name: Desplegar Frontend en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        run: npm run build -- --configuration production --base-href "/Proyecto_micro/"

      - name: Verificar archivos compilados
        run: |
          test -f dist/gestock-client/browser/index.html
          ls -la dist/gestock-client/browser

      - name: Configurar rutas de Angular
        run: |
          cp dist/gestock-client/browser/index.html dist/gestock-client/browser/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos de Angular
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/gestock-client/browser

      - name: Publicar Gestock
        id: deployment
        uses: actions/deploy-pages@v4
